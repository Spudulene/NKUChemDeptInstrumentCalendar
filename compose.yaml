# Local development database.
#
# The fixed port is the whole point. `npx prisma dev` re-rolls an ephemeral port on
# every restart, which silently invalidates the URLs in .env — the failure looks like
# a broken application rather than stale config. 5433 rather than 5432 because a
# machine-wide Postgres already holds 5432.
#
# postgres:17 ships contrib, so `CREATE EXTENSION btree_gist` works and the overlap
# exclusion constraint applies exactly as it does in production.
#
# This is also the first piece of the container work for campus hosting; the app and
# the notification cron join this file in that phase.

services:
  db:
    image: postgres:17
    container_name: instrument-calendar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: instrument
      POSTGRES_PASSWORD: local-dev-only
      POSTGRES_DB: instrument_calendar
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # Migrations and `npm run db:verify` fired at a database that is still starting
      # fail in ways that read as application bugs. Wait on this rather than a sleep.
      test: ["CMD-SHELL", "pg_isready -U instrument -d instrument_calendar"]
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  db-data:
